
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gallery</title>
        <style>
            *{
                margin: 0; padding: 0;
                box-sizing: border-box;
                font-family: Arial, Helvetica, sans-serif;
                text-transform: capitalize;
                transition:all .2s cubic-bezier(.34,1.12,.68,1.31);
            }
    
            .gallery{
                min-height: 100vh;
                background:#eee;
                padding-bottom: 100px;
            }
    
            .gallery .controls{
                display: flex;
                align-items: center;
                justify-content: center;
                flex-wrap: wrap;
                padding:20px 0;
                list-style: none;
            }
    
            .gallery .controls .buttons{
                height:40px;
                width: 140px;
                background:#ffffffe9;
                color:#666666;
                font-size: 20px;
                line-height: 40px;
                cursor: pointer;
                margin:20px;
                box-shadow: 0 3px 5px rgba(0,0,0,.3);
                text-align: center;
            }
    
            .gallery .controls .buttons.active{
                background:rgb(255, 80, 197);
                color:#fff;
            }
    
            .gallery .image-container{
                display: flex;
                align-items: center;
                justify-content: center;
                flex-wrap: wrap;
            }
    
            .gallery .image-container .image{
                height:250px;
                width: 350px;
                overflow: hidden;
                border:15px solid #fff;
                box-shadow: 0 3px 5px rgba(0,0,0,.3);
                margin: 20px;
            }
    
            .gallery .image-container .image img{
                height: 100%;
                width:100%;
                object-fit: cover;
            }
    
            .gallery .image-container .image:hover img{
                transform: scale(1.4);
            }
            .h1{
                text-align: center;
                margin: auto;
            }
        </style>
    
    </head>
    <body>
        <h1>Gallery</h1>
    
        <div class="gallery">
    
            <ul class="controls">
                <li class="buttons active" data-filter="all">all</li>
                <li class="buttons" data-filter="ice-cream">ice-cream</li>
                <li class="buttons" data-filter="chocolate">chocolate</li>
                <li class="buttons" data-filter="cake">cake</li>
                <li class="buttons" data-filter="juice">juice</li>
            </ul>
    
            <div class="image-container">
                <a href="icecream1.jpeg" class="image ice-cream">
                    <img src="icecream1.jpeg" alt="">
                </a>
                <a href="icecream2.jpeg" class="image ice-cream">
                    <img src="icecream2.jpeg" alt="">
                </a>
                <a href="icecream3.jpeg" class="image ice-cream">
                    <img src="icecream3.jpeg" alt="">
                </a>
    
                <a href="choc1.jpeg" class="image chocolate">
                    <img src="choc1.jpeg" alt="">
                </a>
                <a href="choc2.jpeg" class="image chocolate">
                    <img src="choc2.jpeg" alt="">
                </a>
    
                <a href="cake1.jpeg" class="image cake">
                    <img src="cake1.jpeg" alt="">
                </a>
                <a href="cake2.jpeg" class="image cake">
                    <img src="cake2.jpeg" alt="">
                </a>
                <a href="cake3.jpeg" class="image cake">
                    <img src="cake3.jpeg" alt="">
                </a>
                <a href="cake4.jpeg" class="image cake">
                    <img src="cake4.jpeg" alt="">
                </a>
    
                <a href="juice1.jpeg" class="image juice">
                    <img src="juice1.jpeg" alt="">
                </a>
                <a href="juice2.jpeg" class="image juice">
                    <img src="juice2.jpeg" alt="">
                </a>
    
            </div>
    
        </div>
    
        <script>
            // Get all the buttons
            const buttons = document.querySelectorAll('.buttons');
            const images = document.querySelectorAll('.image');
    
            buttons.forEach(button => {
                button.addEventListener('click', () => {
                    // Remove 'active' class from all buttons
                    buttons.forEach(btn => btn.classList.remove('active'));
    
                    // Add 'active' class to the clicked button
                    button.classList.add('active');
    
                    // Get the data-filter value of the clicked button
                    const filter = button.getAttribute('data-filter');
    
                    // Filter images
                    images.forEach(image => {
                        if (filter === 'all' || image.classList.contains(filter)) {
                            image.style.display = 'block';
                        } else {
                            image.style.display = 'none';
                        }
                    });
                });
            });
        </script>
    </body>
    </html>
